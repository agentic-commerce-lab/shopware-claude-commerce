# Mirrors the lint policy of anthropics/commerce-agents (ruff.toml at the pinned commit),
# so the vendored packages stay clean under the same rules as our own code.
line-length = 100
target-version = "py311"
exclude = ["*.md", ".venv", "node_modules", ".next", "docs/media"]
src = ["storefront", "merchant", "vendor", "docker"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W291", "W293"]
ignore = ["E501"]

[lint.isort]
# Upstream lints the blueprint packages as first-party; keep the vendored files byte-identical.
known-first-party = [
    "commerce_common",
    "shopping_agent",
    "shopping_agent_runtime",
    "merchant_agent",
    "merchant_agent_runtime",
    "demo_common",
]
