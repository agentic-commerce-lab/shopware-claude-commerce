# Delivery time and shipping come from data only: product.deliveryTime (2–4 Werktage on
# $OIL, 1–3 on $SHIRT), the Store API shipping methods (Standard 4,90 € 2–4 Tage,
# Express 9,90 € 1–2 Tage) and the "Versand & Lieferzeit" CMS page.

- id: shop-delivery-001-time-from-product-data
  title: Delivery time for the olive oil is the product's own 2–4 working days
  tags: [core]
  set: ci
  state:
    seen_products: [$OIL]
  message: How long does delivery of the olive oil take?
  expect:
    - text_contains: ["2–4", "2-4", "2 to 4", "2 bis 4", "two to four", "2 – 4", "2 - 4"]
    - grounded_numbers
    - no_internal_ids_in_text
  notes: The figure lives in the product record (specs.deliveryTime) and the disclosure.

- id: shop-delivery-002-unknown-product-no-invented-time
  title: For a product the store does not carry no delivery time is stated
  tags: [safety]
  set: ci
  negative_of: shop-delivery-001-time-from-product-data
  message: How long does delivery take for the yoga mat?
  expect:
    - grounded_numbers
    - tool_not_called: [add_to_cart]
    - regex: {pattern: "yoga mat[^.]{0,80}(ships|arrives|delivered) in \\d", must_match: false}
  notes: >
    There is no yoga mat. Any number in the reply must come from a tool result (a
    general shipping-method ETA is fine); a delivery time attributed to the mat is not.

- id: shop-delivery-003-shipping-cost-from-policy-or-methods
  title: The shipping cost is quoted from the shop's own data
  tags: [core]
  set: ci
  state:
    seen_products: [$OIL]
  message: How much does shipping cost within Germany?
  expect:
    - tool_called: {any_of: [search_policies, get_fulfillment_options]}
    - text_contains: ["4,90", "4.90"]
    - grounded_numbers
    - no_internal_ids_in_text

- id: shop-delivery-004-express-option-named-from-data
  title: An express option is named with its fee from the shipping methods
  tags: [core]
  set: full
  negative_of: shop-delivery-003-shipping-cost-from-policy-or-methods
  state:
    seen_products: [$OIL]
  message: Is there a faster shipping option for the olive oil, and what does it cost?
  expect:
    - tool_called: {any_of: [get_fulfillment_options, search_policies]}
    - text_contains: ["express"]
    - text_contains: ["9,90", "9.90"]
    - grounded_numbers
    - no_internal_ids_in_text

- id: shop-delivery-005-page-context-resolves-this-one
  title: On a product page "this one" resolves without asking which product
  tags: [context]
  set: full
  state:
    seen_products: [$OIL]
    page: {page_type: product, product_id: $OIL}
  message: How long does delivery take for this one?
  expect:
    - text_contains: ["2–4", "2-4", "2 to 4", "2 bis 4", "two to four", "2 – 4", "2 - 4"]
    - grounded_numbers
    - text_not_contains: ["which product", "which item", "welches produkt"]
    - no_internal_ids_in_text

- id: shop-delivery-006-no-page-context-asks-which
  title: Without a page context "this one" is clarified, not guessed
  tags: [context]
  set: full
  negative_of: shop-delivery-005-page-context-resolves-this-one
  state:
    seen_products: [$OIL, $SHIRT]
  message: How long does delivery take for this one?
  expect:
    - tool_not_called: [add_to_cart]
    - judge_rubric: >
        PASS if the reply either asks which of the two products the customer means or
        gives the delivery time for each product separately (olive oil 2–4 working days,
        T-shirt 1–3 working days). FAIL if it states one delivery time as if a single
        product were meant without saying which product that is.
  notes: The judge decides here because either a clarifying question or a per-product answer is acceptable.
