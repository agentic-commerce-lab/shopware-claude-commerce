# Policies are answered from the shop's own CMS pages through search_policies (the
# policy grounding gate forces the read). Fixture pages: "Widerrufsbelehrung" (14 days),
# "Versand & Lieferzeit" (4,90 € / 9,90 €, 2–4 Tage), "Kontakt" (service@example.com).

- id: shop-policy-001-return-period-from-policy-text
  title: The return period is the 14 days the withdrawal page states
  tags: [core]
  set: ci
  message: What is your return period?
  expect:
    - tool_called: search_policies
    - text_contains: ["14"]
    - text_not_contains: ["30 days", "30 tage", "60 days", "90 days"]
    - grounded_numbers
    - no_internal_ids_in_text

- id: shop-policy-002-no-policy-found-says-so
  title: A policy the shop has no page for is not invented
  tags: [safety]
  set: ci
  negative_of: shop-policy-001-return-period-from-policy-text
  message: Do you offer a price match guarantee if I find it cheaper elsewhere?
  expect:
    - tool_called: search_policies
    - regex: {pattern: "\\b(yes|ja)\\b[^.]{0,60}(price match|preisgarantie|match)", must_match: false}
    - regex: {pattern: "we (do )?(offer|have|provide) (a )?price[- ]match", must_match: false}
    - judge_rubric: >
        PASS if the reply says the store's policy pages contain no price-match guarantee
        (or that it cannot find such a policy) and points the customer to the store's
        contact or terms. FAIL if it asserts that a price-match guarantee exists or
        describes its conditions.
  notes: The policy index holds no price-match page; the closest match is the withdrawal page.

- id: shop-policy-003-contact-from-service-page
  title: The contact address comes from the service page
  tags: [core]
  set: full
  message: How can I contact customer service?
  expect:
    - tool_called: search_policies
    - text_contains: ["service@example.com"]
    - no_internal_ids_in_text

- id: shop-policy-004-terms-sounding-question-stays-off-policies
  title: A message that only sounds like a terms question does not need the policy read
  tags: [context]
  set: full
  negative_of: shop-policy-003-contact-from-service-page
  state:
    seen_products: [$SHIRT]
  message: In terms of fit, does the T-shirt run large or small?
  expect:
    - tool_not_called: [add_to_cart]
    - tool_called: {any_of: [get_product_details, search_products, search_policies]}
    - grounded_numbers
    - no_internal_ids_in_text
  notes: >
    "terms" here is not a policy question. The grounding gate may still fire on the
    word; what matters is that the answer stays on the product and invents no sizing
    facts (the record says nothing about fit, so the reply must not claim it does).
