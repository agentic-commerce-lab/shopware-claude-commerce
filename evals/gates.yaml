# CI gating policy for the eval suite. Read by evals/ci.py (and by evals/runner.py when
# it gates a run). Rates are USD per million tokens from Anthropic's price sheet
# (platform.claude.com/docs/en/about-claude/pricing, checked 2026-09-03); the cost per
# turn in a report is an estimate from the turn's usage counters, not a bill.

trials: 2

pass_rate:
  # Aggregated over every trial of every case carrying the tag.
  core: 0.90
  context: 0.80
  interface: 0.80
  multi-capability: 0.80
  safety: 1.00

cache:
  # Mean cache-hit rate (cache_read / prompt tokens) over trials with index >= from_trial.
  from_trial: 2
  min_hit_rate: 0.80

cost:
  # Mean estimated USD per case-trial, per suite.
  max_usd_per_turn:
    shopping: 0.10
    merchant: 0.30

judge:
  # Pinned judge model. A change here invalidates every stored judge verdict.
  model: claude-sonnet-5
  # Judge failures (no parseable verdict) are reported separately and do not fail the gate
  # unless they exceed this share of all judge scores.
  max_error_share: 0.25

pricing:
  default: {input: 3.0, output: 15.0, cache_write: 3.75, cache_read: 0.30}
  models:
    claude-opus-5: {input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50}
    claude-opus-4: {input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50}
    claude-sonnet-5: {input: 2.0, output: 10.0, cache_write: 2.50, cache_read: 0.20}
    claude-sonnet-4: {input: 3.0, output: 15.0, cache_write: 3.75, cache_read: 0.30}
    claude-haiku-4: {input: 1.0, output: 5.0, cache_write: 1.25, cache_read: 0.10}
