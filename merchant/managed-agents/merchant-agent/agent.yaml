# Shopware merchant agent: Managed Agent manifest source, adapted from the blueprint's ACME
# manifest (anthropics/commerce-agents @ fd4d5922, merchant-agent/managed-agents).
# scripts/deploy_managed_agent.sh resolves it into a POST /v1/agents body: `system_file` is
# inlined, each `skills[].path` is uploaded through the Skills API and replaced with its
# skill_id, and ${VAR} placeholders come from the environment. Everything else maps onto
# Agents API fields as written.

name: Shopware Merchant Agent
model: claude-opus-5
description: >-
  Merchant agent for a Shopware 6 shop's back office over the Admin API MCP: performance
  insights from order aggregations, catalog and inventory operations, pricing and
  promotions, with every write staged as a Shopware dry run for the operator's approval
  and the UI rendered by the host portal from presentation tool calls. Campaigns are not
  applied to Shopware in this deployment.

# Derived from merchant_agent.prompt.build_static_system with merchant/api/agent_config.py;
# see the note at its top.
system_file: system.md

# The blueprint's skill directories, vendored verbatim (vendor/skills/merchant, see NOTICE),
# are the source of truth shared by every path in this repo.
skills:
  - path: ../../../vendor/skills/merchant/performance-insights
  - path: ../../../vendor/skills/merchant/catalog-listings
  - path: ../../../vendor/skills/merchant/inventory-operations
  - path: ../../../vendor/skills/merchant/pricing-promotions
  - path: ../../../vendor/skills/merchant/marketing-campaigns

# The shop's back office, reached over MCP (see ../merchant-mcp-server, which runs the
# blueprint's MerchantToolExecutor over the Shopware MerchantBackend and its Admin MCP
# transport). No credentials here: register the server's credential in a vault and pass
# vault_ids at session creation; it is matched to this entry by exact URL.
mcp_servers:
  - type: url
    name: merchant
    url: ${MERCHANT_MCP_URL} # e.g. https://merchant-mcp.shop.example/mcp

tools:
  # Skills load through the built-in `read` tool, so it is the one built-in left on;
  # session creation is rejected without it.
  - type: agent_toolset_20260401
    default_config:
      enabled: false
    configs:
      - name: read
        enabled: true
        permission_policy: { type: always_allow }

  # Merchant tools are denied unless listed here, so a new tool on the server is
  # unusable until this manifest is reviewed. Reads and staging run without
  # confirmation: a stage_* call is Shopware's own dry run (`dryRun=true`, rolled back
  # server-side) and records the previewed payload in the server's ledger. apply_change
  # is the one always_ask tool, because it is the only call that sends `dryRun=false`,
  # and the pause is where the operator approves the change. get_campaign_performance and
  # stage_campaign stay enabled so the agent hears the backend's "not applicable" answer
  # instead of a permission refusal.
  - type: mcp_toolset
    mcp_server_name: merchant
    default_config:
      enabled: false
    configs:
      # Reads run without confirmation.
      - name: get_business_snapshot
        enabled: true
        permission_policy: { type: always_allow }
      - name: query_metrics
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_campaign_performance
        enabled: true
        permission_policy: { type: always_allow }
      - name: search_listings
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_listing
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_inventory_alerts
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_order_issues
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_pricing_context
        enabled: true
        permission_policy: { type: always_allow }
      - name: get_pending_changes
        enabled: true
        permission_policy: { type: always_allow }
      - name: recall_memories
        enabled: true
        permission_policy: { type: always_allow }
      # Staging records a proposal; the server checks provenance and guardrails.
      - name: stage_listing_update
        enabled: true
        permission_policy: { type: always_allow }
      - name: stage_price_update
        enabled: true
        permission_policy: { type: always_allow }
      - name: stage_inventory_action
        enabled: true
        permission_policy: { type: always_allow }
      - name: stage_promotion
        enabled: true
        permission_policy: { type: always_allow }
      - name: stage_campaign
        enabled: true
        permission_policy: { type: always_allow }
      - name: discard_change
        enabled: true
        permission_policy: { type: always_allow }
      # Memory writes pause for confirmation.
      - name: save_memory
        enabled: true
        permission_policy: { type: always_ask }
      # The only live mutation; the pause is the operator's approval on the preview card.
      - name: apply_change
        enabled: true
        permission_policy: { type: always_ask }


  # Presentation tools are executed by the host portal: it validates the payload, fills
  # in metric values, alert records, and change diffs by id (the before/after items and
  # the Shopware preview notes from the server's ledger), renders the component, and
  # returns a user.custom_tool_result event. Descriptions and schemas are copied from
  # merchant_agent.tools.registry at the pinned commit for the merchant host's config;
  # merchant/managed-agents/tests/test_manifest.py compares them with the registry.
  - type: custom
    name: present_metrics
    description: >-
      Show measures the tools returned as tiles and trend lines; the portal fills in
      the values. Name each pick as the tool spelled it, or as a campaign id plus
      one measure ('<campaign_id> spend', revenue, budget, or roas).
    input_schema:
      type: object
      properties:
        title: { type: string, maxLength: 80, description: "Short heading for the card." }
        period:
          type: string
          maxLength: 80
          description: "Period the figures cover, as queried."
        picks:
          type: array
          minItems: 1
          maxItems: 8
          description: "Measures to show, takeaway first."
          items:
            type: object
            properties:
              metric:
                type: string
                maxLength: 60
                description: "Measure name as a tool returned it."
              note:
                type: string
                maxLength: 140
                description: "One clause on why this measure matters."
            required: [metric]
            additionalProperties: false
      required: [picks]
      additionalProperties: false

  - type: custom
    name: present_digest
    description: >-
      Show the needs-attention digest: alerts, order issues, metric movements, and
      pending changes, ranked, each with why it matters. Use it when the operator
      asks for a briefing or what needs attention; refer to items by their ids.
    input_schema:
      type: object
      properties:
        title: { type: string, maxLength: 80, description: "Short heading for the digest." }
        items:
          type: array
          minItems: 1
          maxItems: 8
          description: "Entries in priority order."
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [low_stock, slow_mover, order_issue, metric, pending_change, note]
                description: "Entry type; note for a closing summary line."
              ref_id:
                type: string
                maxLength: 64
                description: "Id of the listing, issue, or change concerned."
              headline:
                type: string
                maxLength: 120
                description: "What is wrong, with the payload's figure."
              why_it_matters:
                type: string
                maxLength: 160
                description: "Cost or deadline, and the next action."
            required: [kind, headline]
            additionalProperties: false
      required: [items]
      additionalProperties: false

  - type: custom
    name: present_change_preview
    description: >-
      Show the before-and-after card for one staged change; the portal fills in the
      diff, guardrail notes, and margin impact. Show every staged change with it
      before anything is applied.
    input_schema:
      type: object
      properties:
        change_id:
          type: string
          description: "change_id staged this conversation or listed by get_pending_changes."
        headline:
          type: string
          maxLength: 120
          description: "What the change does, in one line."
        note:
          type: string
          maxLength: 200
          description: "One sentence on why it is safe or worth making."
      required: [change_id]
      additionalProperties: false

  - type: custom
    name: present_suggestions
    description: >-
      Give the turn its 1-4 chips; it ends the reply. Call it in the same round as
      the turn's last present_* call, without waiting for that call's result. Alone,
      after the text, only on a turn with no other present_* call (a guardrail
      explanation, a clarifying question, a listing read-back).
    input_schema:
      type: object
      properties:
        suggestions:
          type: array
          items: { type: string }
          maxItems: 4
          description: "1-4 chips, each a brief imperative that takes the work a step further; leave out anything this turn already showed."
          minItems: 1
      required: [suggestions]
      additionalProperties: false

metadata:
  agent: merchant-agent
  source: shopware_claude_commerce/merchant/managed-agents
  blueprint: anthropics/commerce-agents@fd4d59224ab96b43c6dc6888207c67b3bd5a24cf
