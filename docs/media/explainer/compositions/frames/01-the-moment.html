  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "01-the-moment";
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      function splitWords(el, cls) {
        var text = el.textContent.trim().split(/\s+/);
        el.textContent = "";
        return text.map(function (w, i) {
          var s = document.createElement("span");
          s.className = cls;
          s.textContent = w;
          el.appendChild(s);
          if (i < text.length - 1) el.appendChild(document.createTextNode(" "));
          return s;
        });
      }
      // Waterfall arrival: each word whips up from below, starting before the previous settles.
      function waterfall(spans, at, step) {
        spans.forEach(function (s, i) {
          tl.fromTo(s, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, at + i * step);
        });
      }
      function drawLine(sel, len, at, dur) {
        tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, duration: dur, ease: E }, at);
      }

      var kicker = document.getElementById("f01-kicker");
      var date = document.getElementById("f01-date");
      var l1 = document.getElementById("f01-l1");
      var tag = document.getElementById("f01-tag");
      var l2 = document.getElementById("f01-l2");
      var l3 = document.getElementById("f01-l3");
      var running = document.getElementById("f01-running");

      var dateWords = splitWords(date, "f01-w");
      var l1Words = splitWords(l1, "f01-w");
      var l2Words = splitWords(l2, "f01-w");

      // Start states for everything that arrives later (immediate, outside the timeline).
      gsap.set([l1, tag, l2, l3, running], { opacity: 0 });
      gsap.set(l1Words.concat(l2Words), { opacity: 0 });
      gsap.set("#f01-rule-line", { opacity: 0 });
      gsap.set("#f01-underline", { scaleX: 0 });

      // Scene 1 (0.0–1.6s): kicker + the date, word by word ("September" @0.05, "2nd" @1.22, "2026" @1.87).
      tl.fromTo(kicker, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.0);
      tl.fromTo(dateWords[0], { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.1);
      tl.fromTo(dateWords[1], { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 1.2);
      tl.fromTo(dateWords[2], { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 1.85);

      // Scene 2 (3.2–4.6s): date demotes (slow-fast-slow nudge), line 1 waterfalls in on "Anthropic publishes" (@3.41).
      tl.fromTo(date, { scale: 1, y: 0 }, { scale: 0.5, y: -24, duration: 0.8, ease: "power3.inOut" }, 3.15);
      tl.set(l1, { opacity: 1 }, 3.4);
      waterfall(l1Words, 3.4, 0.16);
      tl.fromTo(tag, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 5.3);

      // Scene 3 (7.3–8.6s): section rule draws on, line 2 waterfalls in on "One day later" (@7.53).
      drawLine("#f01-rule-line", 1100, 7.3, 0.7);
      tl.set(l2, { opacity: 1 }, 7.53);
      waterfall(l2Words, 7.53, 0.16);

      // Scene 4 (8.6–11.6s): lines dim, "This is Shopware's." slams in on "this is Shopware's" (@8.72),
      // blue underline draws on under "Shopware's" (@8.99), the green RUNNING tag lands on "Running." (@11.05).
      tl.to([l1, l2, tag], { opacity: 0.38, duration: 0.5, ease: E }, 8.55);
      tl.to("#f01-rule-line", { opacity: 0.4, duration: 0.5, ease: E }, 8.55);
      tl.fromTo(l3, { opacity: 0, scale: 1.12, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.55, ease: "expo.out" }, 8.7);
      tl.fromTo("#f01-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 9.0);
      tl.fromTo(running, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 11.05);

      // Held read to the cut — nothing moves after ~11.5s.
      window.__timelines[ID] = tl;
    })();
