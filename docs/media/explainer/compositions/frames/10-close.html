  <div id="root" data-composition-id="10-close" data-duration="12.801" data-width="1920" data-height="1080">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "10-close";
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      function splitWords(el, cls) {
        // Split text nodes only, keep the accent <span> intact as one word group.
        var out = [];
        Array.from(el.childNodes).forEach(function (node) {
          if (node.nodeType === 3) {
            var text = node.textContent.split(/(\s+)/);
            var frag = document.createDocumentFragment();
            text.forEach(function (tk) {
              if (!tk) return;
              if (/^\s+$/.test(tk)) { frag.appendChild(document.createTextNode(tk)); return; }
              var s = document.createElement("span"); s.className = cls; s.textContent = tk; frag.appendChild(s); out.push(s);
            });
            el.replaceChild(frag, node);
          } else if (node.nodeType === 1) {
            var inner = node.textContent.split(/(\s+)/);
            node.textContent = "";
            inner.forEach(function (tk) {
              if (!tk) return;
              if (/^\s+$/.test(tk)) { node.appendChild(document.createTextNode(tk)); return; }
              var s = document.createElement("span"); s.className = cls; s.textContent = tk; node.appendChild(s); out.push(s);
            });
          }
        });
        return out;
      }
      var w1 = splitWords(document.getElementById("f10-t1"), "f10-w");   // Shopware is the Commerce Operating System
      var w2 = splitWords(document.getElementById("f10-t2"), "f10-w");   // for the Agent Economy.
      gsap.set(w1.concat(w2), { opacity: 0 });
      gsap.set(["#f10-repo", "#f10-term", "#f10-status", "#f10-p2", "#f10-p3", "#f10-p4", "#f10-p5"], { opacity: 0 });

      function word(s, at) { tl.fromTo(s, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at); }

      // Scene 1 (0.0–4.4s): kicker; the thesis lands word by word on its cues —
      // Shopware @0.04, is @0.52, the @0.65, Commerce @0.85, Operating @1.38, System @2.00, for @2.66, the @2.94, Agent @3.12, Economy @3.59.
      tl.fromTo("#f10-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0);
      var times1 = [0.05, 0.52, 0.65, 0.85, 1.38, 2.0];
      w1.forEach(function (s, i) { word(s, times1[i] != null ? times1[i] : 2.0 + i * 0.1); });
      var times2 = [2.66, 2.94, 3.12, 3.59];
      w2.forEach(function (s, i) { word(s, times2[i] != null ? times2[i] : 3.59 + i * 0.1); });

      // Scene 2 (4.4–6.6s): thesis demotes on "The repository" (@4.42); the lockup pops once the demote has settled, on "link" (@5.36) — the URL is shown, not spoken.
      tl.to("#f10-thesis", { scale: 0.58, y: -60, duration: 0.8, ease: "power3.inOut" }, 4.4);
      tl.fromTo("#f10-repo", { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: E }, 5.2);

      // Scene 3 (6.6–12.0s): terminal springs in ("Five commands" @7.03); the five README commands type on in cascade; status line on "and it runs" (@8.19 → lands after the last command).
      tl.fromTo("#f10-term", { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: E }, 6.65);
      var CMDS = [
        "docker compose -f docker/compose.yaml up -d",
        "./docker/bootstrap.sh",
        "python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements-dev.txt",
        "cp .env.example .env && cat docker/.generated.env >> .env",
        "uvicorn storefront.api.main:app --port 8004"
      ];
      var starts = [7.1, 7.7, 8.1, 9.1, 9.75];
      var durs = [0.55, 0.35, 0.95, 0.6, 0.55];
      CMDS.forEach(function (cmd, i) {
        var el = document.getElementById("f10-c" + (i + 1));
        var st = { p: 0 };
        if (i > 0) tl.set("#f10-p" + (i + 1), { opacity: 1 }, starts[i] - 0.02);
        tl.fromTo(st, { p: 0 }, { p: 1, duration: durs[i], ease: "none", onUpdate: function () {
          el.textContent = cmd.slice(0, Math.round(st.p * cmd.length));
        } }, starts[i]);
      });
      tl.fromTo("#f10-status", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 10.55);

      // Scene 4 (12.0–12.8s): held lockup; only the caret blinks (square wave on timeline time).
      var caret = document.getElementById("f10-caret");
      var blink = { t: 0 };
      tl.fromTo(blink, { t: 0 }, { t: 1, duration: 12.8, ease: "none", onUpdate: function () {
        var t = tl.time();
        caret.style.opacity = t < 9.75 ? "0" : ((t % 1.0) < 0.55 ? "1" : "0");
      } }, 0);

      window.__timelines[ID] = tl;
    })();
  </script>
