<template>
  <style>
    @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/Inter-400.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/Inter-700.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #F3F6FA; }
    .f02-bg { background-color: #0B1220;
      background-image: linear-gradient(rgba(243,246,250,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(243,246,250,0.04) 1px, transparent 1px);
      background-size: 96px 96px; }
    .f02-kicker { position: absolute; left: 0; right: 0; top: 232px; display: flex; justify-content: center; align-items: center; gap: 14px;
      font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A94A6; }
    .f02-kicker svg { width: 22px; height: 22px; }
    .f02-reject { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 120px; line-height: 1.05; letter-spacing: -0.012em; font-style: italic; white-space: nowrap; transform-origin: 50% 0; }
    .f02-strike { position: absolute; left: 50%; top: 396px; width: 900px; margin-left: -450px; height: 8px; border-radius: 4px; background: #8A94A6; transform-origin: 0 50%; }
    .f02-line { position: absolute; left: 0; right: 0; text-align: center; font-size: 112px; line-height: 1.04; letter-spacing: -0.022em; white-space: nowrap; }
    .f02-a { top: 440px; }
    .f02-b { top: 566px; }
    .f02-tail { position: absolute; left: 0; right: 0; top: 730px; text-align: center; font-size: 68px; line-height: 1.1; letter-spacing: -0.012em; color: #8A94A6; white-space: nowrap; }
    .f02-underline { position: absolute; left: 50%; top: 700px; width: 1180px; margin-left: -590px; height: 6px; border-radius: 3px; background: #189EFF; transform-origin: 0 50%; }
    .f02-w { display: inline-block; will-change: transform, opacity; }
  </style>

  <div id="root" data-composition-id="02-execution-layer" data-width="1920" data-height="1080">
    <div id="f02-bg" class="clip f02-bg" data-start="0" data-duration="7.275" data-track-index="0"></div>

    <div id="f02-stage" class="clip" data-start="0" data-duration="7.275" data-track-index="1">
      <div id="f02-kicker" class="f02-kicker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1" stroke="#189EFF" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        <span>the idea</span>
      </div>

      <div id="f02-reject" class="f02-reject">Not a Claude shop.</div>
      <div id="f02-strike" class="f02-strike"></div>

      <div id="f02-a" class="f02-line f02-a">Shopware is the</div>
      <div id="f02-b" class="f02-line f02-b">commerce execution layer</div>
      <div id="f02-underline" class="f02-underline"></div>
      <div id="f02-tail" class="f02-tail">— for any agent.</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "02-execution-layer";
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      function splitWords(el, cls) {
        var text = el.textContent.trim().split(/\s+/);
        el.textContent = "";
        return text.map(function (w, i) {
          var s = document.createElement("span");
          s.className = cls; s.textContent = w; el.appendChild(s);
          if (i < text.length - 1) el.appendChild(document.createTextNode(" "));
          return s;
        });
      }
      function arrive(span, at) {
        tl.fromTo(span, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at);
      }

      var kicker = document.getElementById("f02-kicker");
      var reject = document.getElementById("f02-reject");
      var strike = document.getElementById("f02-strike");
      var a = document.getElementById("f02-a");
      var b = document.getElementById("f02-b");
      var tail = document.getElementById("f02-tail");
      var ul = document.getElementById("f02-underline");

      var rw = splitWords(reject, "f02-w");
      var aw = splitWords(a, "f02-w");
      var bw = splitWords(b, "f02-w");
      var tw = splitWords(tail, "f02-w");

      gsap.set(rw.concat(aw, bw, tw), { opacity: 0 });
      gsap.set(strike, { scaleX: 0 });
      gsap.set(ul, { scaleX: 0 });

      // Scene 1 (0.0–2.0s): kicker, then "Not a Claude shop." word by word ("not" @0.59, "Claude" @0.99, "shop" @1.49); strike draws on.
      tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.0);
      arrive(rw[0], 0.15); arrive(rw[1], 0.45); arrive(rw[2], 0.85); arrive(rw[3], 1.3);
      tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: E }, 1.6);

      // Scene 2 (2.0–4.8s): the struck line nudges up and dims; "Shopware is the / commerce execution layer" arrives on its cues
      // (Shopware @2.30, commerce @3.28, execution @4.01, layer @4.58).
      tl.to([reject, strike], { y: -96, duration: 0.7, ease: "power3.inOut" }, 2.05);
      tl.to(reject, { scale: 0.5, opacity: 0.45, duration: 0.7, ease: "power3.inOut" }, 2.05);
      tl.to(strike, { scaleX: 0.5, x: 225, opacity: 0.45, duration: 0.7, ease: "power3.inOut" }, 2.05);
      arrive(aw[0], 2.3); arrive(aw[1], 2.75); arrive(aw[2], 3.0);
      arrive(bw[0], 3.28); arrive(bw[1], 4.0); arrive(bw[2], 4.55);

      // Scene 3 (4.8–7.2s): blue underline under "execution layer", then the tail "— for any agent." (any @5.88, agent @6.08, runs on @6.61).
      tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 4.75);
      arrive(tw[0], 5.7); arrive(tw[1], 5.85); arrive(tw[2], 6.05); arrive(tw[3], 6.45);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
