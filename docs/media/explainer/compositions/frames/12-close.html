  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "12-close";
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      function splitWords(el, cls) {
        // Split text nodes only, keep the accent <span> intact as one word group.
        var out = [];
        Array.from(el.childNodes).forEach(function (node) {
          if (node.nodeType === 3) {
            var text = node.textContent.split(/(\s+)/);
            var frag = document.createDocumentFragment();
            text.forEach(function (tk) {
              if (!tk) return;
              if (/^\s+$/.test(tk)) { frag.appendChild(document.createTextNode(tk)); return; }
              var s = document.createElement("span"); s.className = cls; s.textContent = tk; frag.appendChild(s); out.push(s);
            });
            el.replaceChild(frag, node);
          } else if (node.nodeType === 1) {
            var inner = node.textContent.split(/(\s+)/);
            node.textContent = "";
            inner.forEach(function (tk) {
              if (!tk) return;
              if (/^\s+$/.test(tk)) { node.appendChild(document.createTextNode(tk)); return; }
              var s = document.createElement("span"); s.className = cls; s.textContent = tk; node.appendChild(s); out.push(s);
            });
          }
        });
        return out;
      }
      var w1 = splitWords(document.getElementById("f12-t1"), "f12-w");   // Shopware is the Commerce Operating System
      var w2 = splitWords(document.getElementById("f12-t2"), "f12-w");   // for the Agent Economy.
      gsap.set(w1.concat(w2), { opacity: 0 });
      gsap.set(["#f12-road", "#f12-roadsub", "#f12-repo", "#f12-term", "#f12-status", "#f12-p2", "#f12-p3", "#f12-p4", "#f12-p5"], { opacity: 0 });

      function word(s, at) { tl.fromTo(s, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at); }

      // Scene 1 (0.0–4.0s): kicker; the thesis lands word by word on its cues —
      // Shopware @0.05, is @0.48, the @0.60, Commerce @0.85, Operating @1.26, System @1.82, for @2.37, the @2.62, Agent @2.80, Economy @3.20.

      var times1 = [0.05, 0.48, 0.6, 0.85, 1.26, 1.82];
      w1.forEach(function (s, i) { word(s, times1[i] != null ? times1[i] : 1.82 + i * 0.1); });
      var times2 = [2.37, 2.62, 2.8, 3.2];
      w2.forEach(function (s, i) { word(s, times2[i] != null ? times2[i] : 3.2 + i * 0.1); });

      // Scene 2 (4.0–11.7s): thesis demotes on "Next" (@4.09); the roadmap row pops on "in progress" (@4.68) — labelled IN PROGRESS on screen and in the voice;
      // its sub-line (Store API MCP tools · staged-change entity + agent-change-* tools · Flow Builder events) lands on "agent tools" (@7.93).
      tl.to("#f12-thesis", { scale: 0.5, y: -90, duration: 0.8, ease: "power3.inOut" }, 4.05);
      tl.fromTo("#f12-road", { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: E }, 4.85);
      tl.fromTo("#f12-roadsub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 7.9);

      // Scene 3 (11.7–14.0s): the lockup pops on "Repository link" (@11.73) — the URL is shown, not spoken.
      tl.fromTo("#f12-repo", { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: E }, 11.75);

      // Scene 4 (14.0–17.8s): terminal springs in ("Five commands" @14.05); the five README commands type on in cascade; status line on "and it runs" (@15.13 → lands after the last command).
      tl.fromTo("#f12-term", { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: E }, 13.95);
      var CMDS = [
        "docker compose -f docker/compose.yaml up -d",
        "./docker/bootstrap.sh",
        "python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements-dev.txt",
        "cp .env.example .env && cat docker/.generated.env >> .env",
        "uvicorn storefront.api.main:app --port 8004"
      ];
      var starts = [14.4, 15.0, 15.4, 16.4, 17.05];
      var durs = [0.55, 0.35, 0.95, 0.6, 0.55];
      CMDS.forEach(function (cmd, i) {
        var el = document.getElementById("f12-c" + (i + 1));
        var st = { p: 0 };
        if (i > 0) tl.set("#f12-p" + (i + 1), { opacity: 1 }, starts[i] - 0.02);
        tl.fromTo(st, { p: 0 }, { p: 1, duration: durs[i], ease: "none", onUpdate: function () {
          el.textContent = cmd.slice(0, Math.round(st.p * cmd.length));
        } }, starts[i]);
      });
      tl.fromTo("#f12-status", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 17.75);

      // Scene 5 (17.8–19.0s): held lockup; only the caret blinks (square wave on timeline time).
      var caret = document.getElementById("f12-caret");
      var blink = { t: 0 };
      tl.fromTo(blink, { t: 0 }, { t: 1, duration: 19.0, ease: "none", onUpdate: function () {
        var t = tl.time();
        caret.style.opacity = t < 17.05 ? "0" : ((t % 1.0) < 0.55 ? "1" : "0");
      } }, 0);
