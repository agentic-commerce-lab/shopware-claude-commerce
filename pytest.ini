[pytest]
addopts = -p asyncio --import-mode=importlib
asyncio_mode = auto
# The Agent SDK packages and the MCP servers live in hyphenated directories, as upstream's do.
pythonpath = . storefront/agent-sdk merchant/agent-sdk storefront/managed-agents/storefront-mcp-server merchant/managed-agents/merchant-mcp-server
testpaths =
    storefront/api/tests
    storefront/agent-sdk/tests
    storefront/managed-agents/tests
    storefront/managed-agents/storefront-mcp-server/tests
    merchant/api/tests
    merchant/agent-sdk/tests
    merchant/managed-agents/tests
    merchant/managed-agents/merchant-mcp-server/tests
    vendor/demo_common/tests
    shopware_common/tests
