# Build the in-browser demo and publish it to GitHub Pages.
# Live URL: https://agentic-commerce-lab.github.io/shopware-claude-commerce/
#
# GitHub Pages is static: no Node Anthropic proxy, no COOP/COEP headers.
# The assembled site injects a public-path prefix and the playground service
# worker adds isolation headers after one reload (SharedArrayBuffer / MariaDB WASM).
# WASM shop + Pyodide artifacts are gitignored and produced here.

name: Pages (browser demo)

on:
  push:
    branches: [main]
    paths:
      - "browser-demo/**"
      - ".github/workflows/pages.yml"
      - "storefront/api/**"
      - "merchant/api/**"
      - "shopware_common/**"
      - "shopware-plugins/**"
      - "docker/plugins/CommerceAgentsHandoff/**"
      - "docker/*.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"
  COMPOSER_MEMORY_LIMIT: "-1"

jobs:
  build:
    name: build browser-demo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Public path for this Pages site
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base" ] || [ "$base" = "/" ]; then
            echo "DEMO_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "DEMO_BASE_PATH=${base%/}/" >> "$GITHUB_ENV"
          fi
          echo "Pages base_url=${{ steps.pages.outputs.base_url }}"
          echo "Pages base_path=${base:-/}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: gd, intl, mysql, zip, xml, mbstring, curl, pdo
          coverage: none
          ini-values: memory_limit=2G

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache playground clone, shop bundle, Pyodide
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            browser-demo/app/public/demo
            browser-demo/build/.cache
          key: browser-demo-${{ runner.os }}-${{ hashFiles('browser-demo/build/config.mjs', 'browser-demo/package-lock.json', 'browser-demo/playground-shims/**', 'browser-demo/ci-fixtures/**', 'requirements.txt') }}
          restore-keys: |
            browser-demo-${{ runner.os }}-

      - name: Install demo npm dependencies
        working-directory: browser-demo
        run: npm ci

      - name: Install Python backends (seed scripts + Pyodide wheel pins)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Build static site
        working-directory: browser-demo
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm run build

      - name: Reject files GitHub Pages cannot serve (≥ 100 MB)
        run: |
          python3 - <<'PY'
          import os, sys
          root = "browser-demo/dist/site"
          limit = 100 * 1024 * 1024
          if not os.path.isdir(root):
              print("assembled site missing", file=sys.stderr)
              sys.exit(1)
          if not os.path.isfile(os.path.join(root, "index.html")):
              print("index.html missing from assembled site", file=sys.stderr)
              sys.exit(1)
          bad = []
          for dirpath, _, files in os.walk(root):
              for name in files:
                  path = os.path.join(dirpath, name)
                  size = os.path.getsize(path)
                  if size >= limit:
                      bad.append((size, path))
          if bad:
              for size, path in sorted(bad, reverse=True):
                  print(f"{size} {path}", file=sys.stderr)
              sys.exit(1)
          print("all files under 100 MB")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser-demo/dist/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
